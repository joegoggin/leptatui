[package]
name = "leptatui"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1.0.102"
any_spawner = { version = "0.3.0", features = ["tokio"] }
crossterm = "0.29.0"
directories = "6.0.0"
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
image = { version = "0.25.10", default-features = false }
leptatui-macros = { path = "../leptatui-macros" }
leptos = { version = "0.9.0-alpha", default-features = false, features = [
    "csr",
] }
open = "5.4.0"
percent-encoding = "2.3.2"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30.0", default-features = false, features = [
    "crossterm_0_29",
    "unstable-rendered-line-info",
] }
ratatui-image = { version = "11.0.6", default-features = false, features = [
    "crossterm",
    "image-defaults",
] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
taffy = "0.12.2"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = [
    "macros",
    "rt",
    "sync",
    "time",
] }
unicode-width = "0.2.2"

[dev-dependencies]
criterion = "0.8.2"
tokio = { version = "1.52.3", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
trybuild = "1"

[[bench]]
name = "layout"
harness = false
