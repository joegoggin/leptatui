[package]
name = "leptatui"
version.workspace = true
edition.workspace = true

[dependencies]
any_spawner = { version = "0.3.0", features = ["tokio"] }
crossterm = "0.29.0"
leptatui-macros = { path = "../leptatui-macros" }
leptos = { version = "0.9.0-alpha", default-features = false, features = [
    "csr",
] }
ratatui = { version = "0.30.0", default-features = false, features = [
    "crossterm_0_29",
    "unstable-rendered-line-info",
] }
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = [
    "macros",
    "rt",
    "sync",
] }

[dev-dependencies]
tokio = { version = "1.52.3", default-features = false, features = [
    "macros",
    "rt-multi-thread",
    "sync",
    "time",
] }
trybuild = "1"
