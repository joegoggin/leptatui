name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality-gates:
    name: Workspace quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Use stable Rust toolchain
        run: rustup default stable

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build docs
        run: cargo doc --workspace --no-deps

      - name: Check examples
        run: cargo check --workspace --examples

  editor-support:
    name: Editor protocol checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install tested Rust and rust-analyzer
        run: rustup toolchain install 1.92.0 --profile minimal --component rust-analyzer
      - name: Use tested toolchain
        run: rustup default 1.92.0
      - name: Build language-server proxy
        run: cargo build --locked -p leptatui-lsp
      - name: Check editor semantics
        run: python3 tools/lsp/test_view.py
